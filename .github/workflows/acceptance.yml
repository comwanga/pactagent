name: Acceptance

# Runs on every PR instead of using path filters: a required status check from a
# path-filtered workflow never reports on PRs outside its paths, which blocks them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  process:
    name: Process recovery acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run separate-process restart and recovery acceptance
        run: npm run test:process

  requester-browser:
    name: Requester browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser binaries are not cached; Playwright recommends a fresh install
      # because restoring the cache takes about as long as downloading.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run deterministic requester Chromium acceptance
        run: npm run test:e2e:requester
