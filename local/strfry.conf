db = "/app/strfry-db/"

events {
    # Strfry 1.1.3 limits normalized event JSON separately from the
    # WebSocket EVENT-message payload. PactAgent measures both before funding.
    maxEventSize = 4194304
}

relay {
    bind = "0.0.0.0"
    port = 7777
    # Developer-only loopback relay (compose.local.yml); unrestricted writes.
    # Public deployments MUST use strfry-hosted.conf and the policy image.
    # 4 MiB normalized event plus a bounded 256-byte allowance for the
    # ["EVENT", event] JSON envelope. This is intentionally finite.
    maxWebsocketPayloadSize = 4194560
}
