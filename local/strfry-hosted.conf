db = "/app/strfry-db/"

dbParams {
    # Hard mmap ceiling; do not grow the LMDB beyond this without review.
    mapsize = 1073741824
}

events {
    # Strfry 1.1.3 limits normalized event JSON separately from the
    # WebSocket EVENT-message payload. PactAgent measures both before funding.
    maxEventSize = 4194304
    rejectEventsNewerThanSeconds = 60
    # Historical coordination evidence may be republished for recovery.
    rejectEventsOlderThanSeconds = 4102444800
}

relay {
    bind = "0.0.0.0"
    port = 7777
    auth {
        enabled = false
    }
    writePolicy {
        plugin = "/app/strfry-write-policy.py"
        timeoutSeconds = 5
    }
    # 4 MiB normalized event plus a bounded 256-byte allowance for the
    # ["EVENT", event] JSON envelope. This is intentionally finite and
    # matches the application-level transport-size contract.
    maxWebsocketPayloadSize = 4194560
}
