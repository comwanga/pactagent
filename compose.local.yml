name: pactagent-local

services:
  strfry:
    image: dockurr/strfry@sha256:599ab3500dbfbe6cb78c668e1892cd9802c192d066df4660e8e3175034a8344d
    container_name: pactagent-local-strfry
    command: ["/app/strfry.sh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - ./.local/strfry-db:/app/strfry-db
      - ./local/strfry.conf:/etc/strfry.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-ILfSs", "http://localhost:7777/"]
      interval: 5s
      timeout: 3s
      retries: 12

  mint:
    image: cashubtc/nutshell:0.21.0
    container_name: pactagent-local-mint
    command: ["poetry", "run", "mint"]
    restart: unless-stopped
    environment:
      MINT_BACKEND_BOLT11_SAT: FakeWallet
      MINT_PRIVATE_KEY: TEST_PRIVATE_KEY
      MINT_LISTEN_HOST: 0.0.0.0
      MINT_LISTEN_PORT: "3338"
      MINT_DATABASE: data/mint
      TOR: "FALSE"
    volumes:
      - ./.local/mint-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fSs", "-o", "/dev/null", "http://localhost:3338/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    container_name: pactagent-local-caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    depends_on:
      strfry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    volumes:
      - ./.local/caddy-data:/data
      - ./local/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost:8443/"]
      interval: 5s
      timeout: 3s
      retries: 12
